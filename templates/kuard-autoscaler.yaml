{{ if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "kuard.fullname" . }}-{{ .Values.envName }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "kuard.fullname" . }}-{{ .Values.envName }}
  minReplicas: {{ .Values.autoscalingMinReplicas }}
  maxReplicas: {{ .Values.autoscalingMaxReplicas }}
  metrics:
  - type: Resource
    {{- with .Values.autoscalingResource }}
    resource:
      {{- toYaml . | nindent 6 }} 
    {{- end }}
{{ end }}
