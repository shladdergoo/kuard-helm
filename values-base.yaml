image:
  repository: gcr.io/kuar-demo/kuard-amd64
  pullPolicy: IfNotPresent

podAnnotations: {}
podLabels: {}

appPort: 8080

livenessProbe:
  httpGet:
    path: /healthy
    port: 8080

readinessProbe:
  httpGet:
    path: /ready
    port: 8080

volumeMounts:
  - mountPath: "/data"
    name: "kuard-data"

volumes:
  - name: "kuard-data"
    hostPath:
      path: "/var/lib/kuard"
