envName: prd

autoscaling:
  enabled: true

autoscalingMinReplicas: 3
autoscalingMaxReplicas: 10

autoscalingResource:
  name: cpu
  target:
    type: Utilization
    averageUtilization: 50

volumes:
  - name: "kuard-data"
    hostPath:
      path: "/var/lib/kuard"

image:
  tag: blue-1.0.0

service:
  type: LoadBalancer
  port: 8080

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "2000m"
    memory: "512Mi"

livenessProbe:
  initialDelaySeconds: 5
  timeoutSeconds: 1
  periodSeconds: 5
  failureThreshold: 2
readinessProbe:
  initialDelaySeconds: 30
  timeoutSeconds: 1
  periodSeconds: 5
  failureThreshold: 2
