apiVersion: v1
kind: Service
metadata:
  name: {{ include "kuard.fullname" . }}-{{ .Values.envName }}
  labels:
    {{- include "kuard.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.appPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "kuard.selectorLabels" . | nindent 4 }}
