envName: dev

autoscaling:
  enabled: false

replicaCount: 1

volumes:
  - name: "kuard-data"
    hostPath:
      path: "/var/lib/kuard"

image:
  tag: blue

service:
  type: NodePort
  port: 8080

resources:
  requests:
    cpu: "500m"
    memory: "128Mi"
  limits:
    cpu: "1000m"
    memory: "256Mi"

livenessProbe:
  initialDelaySeconds: 5
  timeoutSeconds: 1
  periodSeconds: 10
  failureThreshold: 3
readinessProbe:
  initialDelaySeconds: 30
  timeoutSeconds: 1
  periodSeconds: 10
  failureThreshold: 3
